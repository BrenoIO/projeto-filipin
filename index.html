<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Filipin - Agendamento de Treinos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barra de Acessibilidade (ODS 3: Saúde e Bem-Estar para Todos) -->
  <header>
    <div class="accessibility-bar" role="region" aria-label="Ferramentas de Acessibilidade">
      <span>Acessibilidade:</span>
      <button id="btn-contrast" aria-label="Alternar Modo de Alto Contraste">🎨 Alto Contraste</button>
      <button id="btn-font-increase" aria-label="Aumentar Tamanho da Fonte">A+</button>
      <button id="btn-font-decrease" aria-label="Diminuir Tamanho da Fonte">A-</button>
    </div>
    <h1>🥋 Projeto Filipin — Agendamento de Treinos</h1>
  </header>

  <main class="container">
    <!-- Cartão 1: Formulário de Agendamento -->
    <section class="card">
      <h2>Reservar Aula de Jiu-Jitsu</h2>
      <form id="booking-form">
        <label for="student-name">Nome do Atleta:</label>
        <input type="text" id="student-name" required placeholder="Digite o seu nome completo">

        <label for="belt">Faixa Atual:</label>
        <select id="belt" required>
          <option value="">Selecione a sua faixa</option>
          <option value="Branca">Branca</option>
          <option value="Azul">Azul</option>
          <option value="Roxa">Roxa</option>
          <option value="Marrom">Marrom</option>
          <option value="Preta">Preta</option>
        </select>

        <label for="class-time">Horário do Treino:</label>
        <select id="class-time" required>
          <option value="">Selecione o horário</option>
          <option value="07:00 - Jiu-Jitsu Matinal">07:00 - Jiu-Jitsu Matinal</option>
          <option value="12:00 - Treino Executivo">12:00 - Treino Executivo</option>
          <option value="19:30 - Fundamental & Submission">19:30 - Fundamental & Submission</option>
        </select>

        <button type="submit" class="btn-primary">Confirmar Agendamento</button>
      </form>
    </section>

    <!-- Cartão 2: Lista de Aulas Agendadas (Fluxo Operacional Estendido) -->
    <section class="card" style="margin-top: 20px;">
      <h2>📋 Atletas com Aulas Agendadas</h2>
      <ul id="bookings-list" style="margin-top: 10px; padding-left: 20px;">
        <li style="color: #666;">Nenhum agendamento realizado ainda.</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

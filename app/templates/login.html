{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="card card-login">
  <h1>Entrar</h1>
  <p class="sutil">Acesso restrito aos professores e instrutores.</p>
  <form method="post" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="username" autofocus value="{{ email or '' }}">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required autocomplete="current-password">
    <button type="submit" class="btn btn-primario">Entrar</button>
  </form>
</section>
{% endblock %}

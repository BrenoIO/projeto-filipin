<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Filipin - Agendamento de Treinos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <!-- Barra de Acessibilidade (ODS 3: Saúde e Bem-Estar para Todos) -->
  <header>
    <div class="accessibility-bar" role="region" aria-label="Ferramentas de Acessibilidade">
      <span>Acessibilidade:</span>
      <button id="btn-contrast" aria-label="Alternar Modo de Alto Contraste">🎨 Alto Contraste</button>
      <button id="btn-font-increase" aria-label="Aumentar Tamanho da Fonte">A+</button>
      <button id="btn-font-decrease" aria-label="Diminuir Tamanho da Fonte">A-</button>
    </div>
    <h1>🥋 Projeto Filipin — Agendamento de Treinos</h1>
  </header>

  <main class="container">
    <!-- Cartão 1: Formulário de Agendamento -->
    <section class="card">
      <h2>Reservar Aula de Jiu-Jitsu</h2>
      <form id="booking-form">
        <label for="student-name">Nome da Criança (Atleta):</label>
        <input type="text" id="student-name" required placeholder="Digite o nome completo da criança">

        <label for="student-age">Idade:</label>
        <input type="number" id="student-age" required min="3" max="17" placeholder="Ex: 10">

        <label for="guardian-name">Nome do Responsável (Obrigatório):</label>
        <input type="text" id="guardian-name" required placeholder="Nome do pai, mãe ou responsável legal">

        <label for="belt">Faixa Atual:</label>
        <select id="belt" required>
          <option value="">Selecione a faixa</option>
          <option value="Branca">Branca</option>
          <option value="Cinza">Cinza</option>
          <option value="Amarela">Amarela</option>
          <option value="Laranja">Laranja</option>
          <option value="Verde">Verde</option>
          <option value="Azul">Azul</option>
          <!-- Adicionadas as faixas infanto-juvenis comuns -->
        </select>

        <label for="observation">Observações (Alergias / Restrições):</label>
        <textarea id="observation"
          placeholder="Ex: Alergia a picada de abelha, toma remédio X... (Opcional)"></textarea>

        <button type="submit" class="btn-primary">Cadastrar Aluno</button>
      </form>
    </section>

    <!-- Cartão 2: Lista de Aulas Agendadas (Fluxo Operacional Estendido) -->
    <section class="card" style="margin-top: 20px;">
      <h2>📋 Atletas com Aulas Agendadas</h2>
      <ul id="bookings-list" style="margin-top: 10px; padding-left: 20px;">
        <li style="color: #666;">Nenhum agendamento realizado ainda.</li>
      </ul>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
